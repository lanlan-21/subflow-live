<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時聽打協作平台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 24px 0;
      text-align: center;
      color: #38bdf8;
    }
    .section-title {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .btn-channel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: #334155;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      transition: background 0.2s;
    }
    .btn-channel:hover {
      background: #2563eb;
    }
    .divider {
      height: 1px;
      background: #334155;
      margin: 20px 0;
    }
    .custom-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .btn-action {
      padding: 10px 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: #1d4ed8;
    }
    .btn-random {
      width: 100%;
      background: #475569;
    }
    .btn-random:hover {
      background: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>即時聽打協作平台</h1>

    <div class="section-title">常用固定頻道</div>
    <div class="channels-grid">
      <a href="/edit/A" class="btn-channel">頻道 A</a>
      <a href="/edit/B" class="btn-channel">頻道 B</a>
      <a href="/edit/C" class="btn-channel">頻道 C</a>
    </div>

    <div class="divider"></div>

    <div class="section-title">自訂房號或加入會議</div>
    <div class="custom-box">
      <input type="text" id="customRoomInput" placeholder="輸入自訂會議室名稱..." onkeydown="if(event.key==='Enter') joinCustomRoom()">
      <button class="btn-action" onclick="joinCustomRoom()">進入</button>
    </div>

    <button class="btn-action btn-random" onclick="window.location.href='/new_room'">＋ 隨機建立全新臨時會議室</button>
  </div>

  <script>
    function joinCustomRoom() {
      const room = document.getElementById('customRoomInput').value.trim();
      if (!room) {
        alert('請輸入會議室名稱！');
        return;
      }
      window.location.href = '/edit/' + encodeURIComponent(room);
    }
  </script>
</body>
</html>
