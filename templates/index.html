<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時聽打管理中心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container { width: 100%; max-width: 900px; }
    .header { text-align: center; margin-bottom: 40px; }
    .header h1 { font-size: 32px; font-weight: 800; letter-spacing: 1px; color: #f8fafc; margin-bottom: 8px; }
    .header .subtitle { font-size: 15px; color: #94a3b8; }
    .action-bar { display: flex; justify-content: center; margin-bottom: 36px; }
    .btn-create {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      transition: all 0.2s;
    }
    .btn-create:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-2px);
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::before {
      content: "";
      width: 4px;
      height: 18px;
      background: #38bdf8;
      border-radius: 2px;
    }
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .channel-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }
    .channel-card:hover { transform: translateY(-3px); }
    .card-top { margin-bottom: 20px; }
    .channel-title {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .channel-tag {
      font-size: 11px;
      padding: 2px 8px;
      background: #334155;
      color: #38bdf8;
      border-radius: 20px;
      font-weight: 500;
    }
    .channel-desc { font-size: 13px; color: #94a3b8; line-height: 1.5; }
    .card-actions { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      text-align: center;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-edit { background: #2563eb; color: #fff; }
    .btn-view { background: #16a34a; color: #fff; }
    .footer { text-align: center; font-size: 12px; color: #64748b; margin-top: auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>即時聽打工作中心</h1>
      <p class="subtitle">雙人差量同步 ‧ 投影比例錨定 ‧ 現場無延遲字幕系統</p>
    </div>

    <div class="action-bar">
      <a href="/new_room" class="btn-create">+ 建立臨時獨立活動頻道</a>
    </div>

    <div class="section-title">常駐固定頻道</div>
    <div class="channel-grid">
      <div class="channel-card">
        <div class="card-top">
          <div class="channel-title">
            頻道 A
            <span class="channel-tag">主會場</span>
          </div>
          <p class="channel-desc">適合大會報告、主題演講或主要舞台現場聽打。</p>
        </div>
        <div class="card-actions">
          <a href="/edit/A" class="btn btn-edit">聽打後台</a>
          <a href="/view/A" target="_blank" class="btn btn-view">觀眾看版</a>
        </div>
      </div>

      <div class="channel-card">
        <div class="card-top">
          <div class="channel-title">
            頻道 B
            <span class="channel-tag">分會場</span>
          </div>
          <p class="channel-desc">適合分組研討、工作坊或第二同步議程使用。</p>
        </div>
        <div class="card-actions">
          <a href="/edit/B" class="btn btn-edit">聽打後台</a>
          <a href="/view/B" target="_blank" class="btn btn-view">觀眾看版</a>
        </div>
      </div>

      <div class="channel-card">
        <div class="card-top">
          <div class="channel-title">
            頻道 C
            <span class="channel-tag">備用 / 測試</span>
          </div>
          <p class="channel-desc">適合聽打員賽前測試、打字手感校對或臨時備用。</p>
        </div>
        <div class="card-actions">
          <a href="/edit/C" class="btn btn-edit">聽打後台</a>
          <a href="/view/C" target="_blank" class="btn btn-view">觀眾看版</a>
        </div>
      </div>
    </div>

    <div class="footer">
      即時聽打協同系統 ‧ 全平台支援（電腦投影 / 平板 / 手機看版）
    </div>
  </div>
</body>
</html>
