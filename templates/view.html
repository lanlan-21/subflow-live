<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時聽打投影 - 頻道 {{ room_id }}</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffff33;
      font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    #displayArea {
      width: 100%;
      min-height: 100%;
      font-size: 48px;
      line-height: 1.25;
      letter-spacing: 0px;
      white-space: pre-wrap;
      word-break: break-all;
      text-align: justify;
      transform-origin: top left;
      padding: 16px 16px 140px 16px;
    }

    #statusBadge {
      position: fixed;
      top: 12px;
      right: 16px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #475569;
      color: #94a3b8;
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
      padding: 4px 12px;
      border-radius: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      box-shadow: 0 0 6px #22c55e;
    }
  </style>
</head>
<body>

  <div id="statusBadge">
    <span class="status-dot"></span>
    <span id="statusText">大螢幕連線中...</span>
  </div>

  <div id="displayArea"></div>

  <script>
    const socket = io({ reconnection: true, reconnectionAttempts: Infinity, reconnectionDelay: 500 });
    const roomId = "{{ room_id }}";
    const displayArea = document.getElementById('displayArea');
    const statusText = document.getElementById('statusText');
    const statusBadge = document.getElementById('statusBadge');

    let currentScale = 100;
    let autoScrollEnabled = true;

    function scrollToBottom() {
      if (!autoScrollEnabled) return;
      window.scrollTo({
        top: document.documentElement.scrollHeight,
        behavior: 'smooth'
      });
    }

    window.addEventListener('scroll', () => {
      const scrollPos = window.innerHeight + window.scrollY;
      const threshold = document.documentElement.scrollHeight - 80;
      autoScrollEnabled = (scrollPos >= threshold);
    });

    socket.on('connect', () => {
      socket.emit('join', { room: roomId, is_editor: false });
      statusText.innerText = "已連線至頻道 " + roomId + " (投影端)";
      setTimeout(() => { statusBadge.style.opacity = '0'; }, 3500);
    });

    socket.on('init_document', data => {
      if (!data) return;
      displayArea.innerText = (data.text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      if (data.settings) {
        applySettings(data.settings);
      }
      setTimeout(scrollToBottom, 60);
    });

    socket.on('remote_operation', data => {
      if (!data) return;

      if (data.is_clear) {
        displayArea.innerText = '';
        return;
      }

      let text = displayArea.innerText;
      const ops = data.ops || [];

      for (const op of ops) {
        if (op.type === 'insert') {
          const insertText = op.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
          const p = Math.min(op.pos, text.length);
          text = text.slice(0, p) + insertText + text.slice(p);
        } else if (op.type === 'delete') {
          const p = Math.min(op.pos, text.length);
          const endP = Math.min(p + op.len, text.length);
          text = text.slice(0, p) + text.slice(endP);
        }
      }

      displayArea.innerText = text;
      scrollToBottom();
    });

    socket.on('sync_settings', settings => {
      if (settings) {
        applySettings(settings);
      }
    });

    function applySettings(settings) {
      if (settings.size) {
        displayArea.style.fontSize = settings.size + 'px';
      }
      if (settings.scale !== undefined) {
        currentScale = settings.scale;
        const scaleVal = currentScale / 100;
        if ('zoom' in displayArea.style) {
          displayArea.style.zoom = scaleVal;
        } else {
          displayArea.style.transform = `scale(${scaleVal})`;
          displayArea.style.width = `${100 / scaleVal}%`;
        }
      }
      const px = (settings.pad_x !== undefined ? settings.pad_x : 16) + 'px';
      const py = (settings.pad_y !== undefined ? settings.pad_y : 16) + 'px';
      displayArea.style.padding = `${py} ${px} 140px ${px}`;

      scrollToBottom();
    }
  </script>
</body>
</html>
