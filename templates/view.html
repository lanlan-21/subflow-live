<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>觀眾大螢幕 - 頻道 {{ room_id }}</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill-cursors@3.1.0/dist/quill-cursors.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0a0a0a; color: #ffff33;
      font-family: "TW-Kai", "DFKai-SB", "BiauKai", "標楷體", serif;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }
    #viewerContainer { position: relative; flex: 1; width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; }
    
    /* 覆蓋 Quill 預設，呈現無干擾的大螢幕 */
    .ql-toolbar { display: none !important; }
    .ql-container.ql-snow { border: none !important; font-family: inherit; font-size: inherit; height: auto; }
    .ql-editor {
      min-height: 50px; padding: 16px 8px 60px 8px; 
      font-family: inherit !important; font-size: 48px; line-height: 1.25; color: inherit !important;
      white-space: pre-wrap; word-break: break-all; text-align: justify; overflow-y: visible;
    }
  </style>
</head>
<body>
  <div id="viewerContainer">
    <div id="editor">等待聽打員連線...</div>
  </div>

  <script>
    const socket = io({ reconnection: true, reconnectionAttempts: Infinity });
    const roomId = "{{ room_id }}";
    
    // 初始化觀眾端唯讀引擎
    Quill.register('modules/cursors', QuillCursors);
    const quill = new Quill('#editor', { 
      theme: 'snow', 
      readOnly: true, 
      modules: { toolbar: false, cursors: { transformOnTextChange: true, hideDelayMs: 3000, hideSpeedMs: 400 } },
      formats: [] 
    });
    const cursors = quill.getModule('cursors');
    const qlEditor = document.querySelector('.ql-editor');
    const viewerContainer = document.getElementById('viewerContainer');
    let currentMasterClientId = null;

    socket.on('connect', () => { quill.setText('\n'); socket.emit('join', { room: roomId, is_editor: false }); });

    socket.on('init_document', data => {
      if (data && data.delta) quill.setContents(data.delta);
      if (data && data.settings) applySettings(data.settings);
    });

    socket.on('sync_settings', data => { applySettings(data); });

    function applySettings(settings) {
      if (settings.theme === 'dark') { document.body.style.background = '#0a0a0a'; document.body.style.color = '#ffff33'; }
      if (settings.theme === 'green') { document.body.style.background = '#c7edcc'; document.body.style.color = '#111827'; }
      if (settings.theme === 'navy') { document.body.style.background = '#0b132b'; document.body.style.color = '#e0e1dd'; }
      if (settings.theme === 'light') { document.body.style.background = '#f1f5f9'; document.body.style.color = '#0f172a'; }
      const px = (settings.pad_x || 8) + 'px'; const py = (settings.pad_y || 16) + 'px';
      qlEditor.style.fontSize = (settings.size || 48) + 'px';
      qlEditor.style.padding = `${py} ${px} 60px ${px}`;
      qlEditor.style.zoom = (settings.scale || 100) / 100;
    }

    socket.on('remote_operation', data => {
      if (data.is_clear) { quill.setText('\n'); return; }
      const ops = data.ops || [];
      const Delta = Quill.import('delta');
      for (let op of ops) {
        let opDelta = new Delta();
        if (op.pos > 0) opDelta.retain(op.pos);
        if (op.type === 'insert') opDelta.insert(op.text);
        else if (op.type === 'delete') opDelta.delete(op.len);
        quill.updateContents(opDelta, 'api');
      }
      
      // 智能滾動：只有當畫面已經在底部附近時，才自動往下滾
      const isNearBottom = viewerContainer.scrollHeight - viewerContainer.scrollTop - viewerContainer.clientHeight < 150;
      if (isNearBottom) {
         viewerContainer.scrollTop = viewerContainer.scrollHeight;
      }
    });

    socket.on('role_status_update', data => {
      currentMasterClientId = data.master_client_id;
    });

    socket.on('cursor_update', data => {
      if (!data || !data.client_id) return;
      const isMaster = (data.client_id === currentMasterClientId);
      const color = isMaster ? '#16a34a' : '#0284c7';
      const name = isMaster ? '👑 主聽打員' : '✏️ 協作夥伴';
      cursors.createCursor(data.client_id, name, color);
      cursors.moveCursor(data.client_id, { index: data.cursor_index, length: data.cursor_length || 0 });
    });

    socket.on('cursor_remove', data => {
      if (data && data.client_id) cursors.removeCursor(data.client_id);
    });
  </script>
</body>
</html>
