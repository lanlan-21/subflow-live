<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>即時字幕 - 頻道 {{ room_id }}</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { 
      box-sizing: border-box; 
      -webkit-user-select: none;
      user-select: none;
      font-family: "DFKai-SB", "BiauKai", "標楷體", "TW-Kai", serif !important;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw;
      height: 100vh;
      background-color: #121212;
      color: #ffff33;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
    }
    body::-webkit-scrollbar { display: none; }
    
    #captionContent {
      width: 100%;
      min-height: 100vh;
      padding: 10px 8px 70px 8px;
      font-size: 48px;
      line-height: 1.1;
      white-space: pre-wrap;
      word-break: break-all;
      text-align: justify;
      transform-origin: top left;
      cursor: default;
    }

    .top-hover-sensor {
      position: fixed;
      top: 0;
      right: 0;
      width: 160px;
      height: 70px;
      z-index: 1000;
    }

    .hover-info-badge {
      position: fixed;
      top: 12px;
      right: 12px;
      background: rgba(20, 20, 20, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 14px;
      border-radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
      font-size: 13px;
      color: #e2e8f0;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 999;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      text-align: center;
    }

    .top-hover-sensor:hover + .hover-info-badge,
    .hover-info-badge:hover,
    .hover-info-badge.show-fixed {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
    }
    
    #viewQrBox {
      background: #fff;
      padding: 6px;
      border-radius: 8px;
      display: inline-block;
      margin: 8px 0;
    }

    .badge-url {
      font-size: 11px;
      color: #38bdf8;
      word-break: break-all;
      max-width: 150px;
    }

    .audience-zoom-pill {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .audience-zoom-pill.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .zoom-btn {
      background: #3f3f46;
      border: none;
      color: #f4f4f5;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .zoom-value {
      font-size: 13px;
      font-weight: 600;
      color: #e4e4e7;
      min-width: 48px;
      text-align: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-hover-sensor" id="hoverSensor"></div>
  <div class="hover-info-badge" id="infoBadge">
    <div><span class="status-dot" id="netDot"></span><strong>頻道 {{ room_id }} 觀眾看版</strong></div>
    <div id="viewQrBox"></div>
    <div class="badge-url" id="liveUrl"></div>
  </div>

  <div id="captionContent"></div>

  <div class="audience-zoom-pill" id="zoomPill">
    <button class="zoom-btn" onclick="adjustPersonalScale(-10)" title="縮小">A⁻</button>
    <span class="zoom-value" id="zoomValText" onclick="resetPersonalScale()" title="還原與主控同比例">100%</span>
    <button class="zoom-btn" onclick="adjustPersonalScale(10)" title="放大">A⁺</button>
  </div>

  <script>
    const socket = io();
    const roomId = "{{ room_id }}";
    const box = document.getElementById('captionContent');
    const netDot = document.getElementById('netDot');
    const zoomPill = document.getElementById('zoomPill');
    const zoomValText = document.getElementById('zoomValText');
    const infoBadge = document.getElementById('infoBadge');

    const liveUrlStr = window.location.href;
    document.getElementById('liveUrl').innerText = liveUrlStr;

    new QRCode(document.getElementById('viewQrBox'), {
      text: liveUrlStr,
      width: 110,
      height: 110,
      colorDark : "#0f172a",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.M
    });

    let masterBaseScale = 100;
    let personalZoom = 100;
    let pillTimer = null;

    applyCombinedScale();

    socket.emit('join', { room: roomId, is_editor: false });
    socket.on('connect', () => { netDot.style.background = '#22c55e'; });
    socket.on('disconnect', () => { netDot.style.background = '#ef4444'; });

    // 初次進來立即從伺服器拉取最新完整文稿
    socket.on('init_document', data => {
      if (!data) return;
      box.innerText = (data.text || '').trimEnd();
      if (data.settings) updateStyle(data.settings);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    });

    // 接收即時文字同步
    socket.on('sync_text', data => {
      if (!data) return;
      const displayText = data.clean_text !== undefined ? data.clean_text : data.text;
      if (typeof displayText === 'string') {
        box.innerText = displayText;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
      box.style.fontFamily = '"DFKai-SB", "BiauKai", "標楷體", "TW-Kai", serif';
      if (data.size) box.style.fontSize = data.size + 'px';
      if (data.pad_x !== undefined && data.pad_y !== undefined) {
        box.style.padding = `${data.pad_y}px ${data.pad_x}px 70px ${data.pad_x}px`;
      }
      if (data.scale !== undefined) {
        masterBaseScale = data.scale;
        applyCombinedScale();
      }
    });

    function updateStyle(s) {
      box.style.fontFamily = '"DFKai-SB", "BiauKai", "標楷體", "TW-Kai", serif';
      if (s.size) box.style.fontSize = s.size + 'px';
      if (s.pad_x !== undefined && s.pad_y !== undefined) {
        box.style.padding = `${s.pad_y}px ${s.pad_x}px 70px ${s.pad_x}px`;
      }
      if (s.scale !== undefined) {
        masterBaseScale = s.scale;
        applyCombinedScale();
      }
    }

    function applyCombinedScale() {
      const finalPercent = Math.round((masterBaseScale * personalZoom) / 100);
      zoomValText.innerText = personalZoom + '%';
      const s = finalPercent / 100;
      if ('zoom' in box.style) {
        box.style.zoom = s;
      } else {
        box.style.transform = `scale(${s})`;
      }
    }

    function adjustPersonalScale(delta) {
      personalZoom = Math.min(Math.max(personalZoom + delta, 50), 200);
      applyCombinedScale();
      showPillTemporarily();
    }

    function resetPersonalScale() {
      personalZoom = 100;
      applyCombinedScale();
      showPillTemporarily();
    }

    function showPillTemporarily() {
      zoomPill.classList.add('visible');
      clearTimeout(pillTimer);
      pillTimer = setTimeout(() => { zoomPill.classList.remove('visible'); }, 3500);
    }

    document.addEventListener('click', (e) => { 
      if (!zoomPill.contains(e.target) && !infoBadge.contains(e.target)) {
        showPillTemporarily();
      }
    });

    document.getElementById('hoverSensor').addEventListener('touchstart', () => {
      infoBadge.classList.add('show-fixed');
      setTimeout(() => infoBadge.classList.remove('show-fixed'), 4000);
    }, { passive: true });

    zoomPill.addEventListener('click', (e) => e.stopPropagation());
    zoomPill.addEventListener('dblclick', (e) => { e.stopPropagation(); e.preventDefault(); });

    document.addEventListener('dblclick', (e) => {
      if (zoomPill.contains(e.target) || infoBadge.contains(e.target)) return;
      if (window.getSelection) window.getSelection().removeAllRanges();
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else if (document.exitFullscreen) document.exitFullscreen();
    });
  </script>
</body>
</html>
