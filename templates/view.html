<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時聽打投影 - 頻道 {{ room_id }}</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffff33;
      font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    /* 🌟 觀眾端獨立控制列（滑鼠移至頂部浮現，5 秒無動作半透明） */
    .viewer-toolbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid #334155;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 2000;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
      color: #e2e8f0;
      font-size: 13px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .viewer-toolbar.dimmed {
      opacity: 0.15;
    }
    .viewer-toolbar:hover {
      opacity: 1 !important;
      transform: translateY(0);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .size-input {
      width: 54px;
      text-align: center;
      padding: 3px 6px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #1e293b;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .btn-step {
      padding: 4px 8px;
      border: 1px solid #475569;
      background: #334155;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }
    .btn-step:hover { background: #475569; }

    .btn {
      padding: 5px 12px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn:hover { background: #334155; }
    .btn-blue { background: #2563eb; border: none; }
    .btn-blue:hover { background: #1d4ed8; }
    
    .status-pill {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #94a3b8;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      box-shadow: 0 0 6px #22c55e;
    }

    #displayArea {
      width: 100%;
      min-height: 100%;
      font-size: 48px;
      line-height: 1.25;
      letter-spacing: 0px;
      white-space: pre-wrap;
      word-break: break-all;
      text-align: justify;
      transform-origin: top left;
      padding: 60px 16px 140px 16px; /* 頂部預留 60px 不遮擋文字 */
    }

    /* 全螢幕模式隱藏工具列，滑鼠移到頂部才出現 */
    body.is-fullscreen .viewer-toolbar {
      transform: translateY(-90%);
    }
    body.is-fullscreen .viewer-toolbar:hover {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- 🌟 觀眾端自由縮放控制列 -->
  <div class="viewer-toolbar" id="viewerToolbar">
    <div class="control-group">
      <label for="fontSizeInput">字號：</label>
      <input type="number" id="fontSizeInput" class="size-input" value="48" min="16" max="150" step="2" onchange="applyViewerStyle()">
      <button class="btn-step" onclick="stepFontSize(2)">A⁺</button>
      <button class="btn-step" onclick="stepFontSize(-2)">A⁻</button>
    </div>

    <div class="control-group">
      <label for="scaleInput">比例：</label>
      <input type="number" id="scaleInput" class="size-input" value="100" min="40" max="250" step="5" onchange="applyViewerStyle()">%
      <button class="btn-step" onclick="stepScale(5)">+5%</button>
      <button class="btn-step" onclick="stepScale(-5)">-5%</button>
    </div>

    <button class="btn" id="scrollLockBtn" onclick="toggleAutoScroll()">
      ⬇️ 自動捲動：開
    </button>

    <button class="btn" onclick="toggleFullscreen()">
      ⛶ 全螢幕
    </button>

    <div class="status-pill">
      <span class="status-dot"></span>
      <span>頻道 {{ room_id }} 即時投影</span>
    </div>
  </div>

  <div id="displayArea"></div>

  <script>
    const socket = io({ reconnection: true, reconnectionAttempts: Infinity, reconnectionDelay: 500 });
    const roomId = "{{ room_id }}";
    const displayArea = document.getElementById('displayArea');
    const fontSizeInput = document.getElementById('fontSizeInput');
    const scaleInput = document.getElementById('scaleInput');
    const scrollLockBtn = document.getElementById('scrollLockBtn');
    const viewerToolbar = document.getElementById('viewerToolbar');

    let autoScrollEnabled = true;
    let toolbarTimer = null;

    // 工具列淡出計時
    function resetToolbarDim() {
      viewerToolbar.classList.remove('dimmed');
      clearTimeout(toolbarTimer);
      toolbarTimer = setTimeout(() => {
        viewerToolbar.classList.add('dimmed');
      }, 4000);
    }
    window.addEventListener('mousemove', resetToolbarDim);
    resetToolbarDim();

    // 🌟 觀眾本機調整風格
    function stepFontSize(delta) {
      let val = (parseInt(fontSizeInput.value, 10) || 48) + delta;
      fontSizeInput.value = Math.min(Math.max(val, 16), 150);
      applyViewerStyle();
    }

    function stepScale(delta) {
      let val = (parseInt(scaleInput.value, 10) || 100) + delta;
      scaleInput.value = Math.min(Math.max(val, 40), 250);
      applyViewerStyle();
    }

    function applyViewerStyle() {
      const size = fontSizeInput.value || 48;
      const scale = (parseInt(scaleInput.value, 10) || 100) / 100;

      displayArea.style.fontSize = size + 'px';
      if ('zoom' in displayArea.style) {
        displayArea.style.zoom = scale;
      } else {
        displayArea.style.transform = `scale(${scale})`;
        displayArea.style.width = `${100 / scale}%`;
      }
      scrollToBottom();
    }

    function toggleAutoScroll() {
      autoScrollEnabled = !autoScrollEnabled;
      scrollLockBtn.innerText = autoScrollEnabled ? "⬇️ 自動捲動：開" : "⏸️ 自動捲動：關";
      scrollLockBtn.style.color = autoScrollEnabled ? "#4ade80" : "#f87171";
      if (autoScrollEnabled) scrollToBottom();
    }

    function scrollToBottom() {
      if (!autoScrollEnabled) return;
      window.scrollTo({
        top: document.documentElement.scrollHeight,
        behavior: 'smooth'
      });
    }

    // 若使用者手動往上滑看舊內容，自動將鎖定標籤切換為關
    window.addEventListener('scroll', () => {
      const scrollPos = window.innerHeight + window.scrollY;
      const threshold = document.documentElement.scrollHeight - 80;
      if (scrollPos < threshold && autoScrollEnabled) {
        // 使用者主動往上滑，暫停強行往下拉
        autoScrollEnabled = false;
        scrollLockBtn.innerText = "⏸️ 自動捲動：關";
        scrollLockBtn.style.color = "#f87171";
      } else if (scrollPos >= threshold && !autoScrollEnabled) {
        // 滑到底部自動恢復開啟
        autoScrollEnabled = true;
        scrollLockBtn.innerText = "⬇️ 自動捲動：開";
        scrollLockBtn.style.color = "#4ade80";
      }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
    document.addEventListener('fullscreenchange', () => {
      document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement);
    });

    // 🌟 連線與身分宣告：嚴格為唯讀觀眾端
    socket.on('connect', () => {
      socket.emit('join', { room: roomId, is_editor: false });
    });

    // 初始化全篇文字
    socket.on('init_document', data => {
      if (!data) return;
      displayArea.innerText = (data.text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      // 若後端有預設設定且觀眾尚未手動調整過
      if (data.settings && !sessionStorage.getItem('VIEWER_CUSTOMIZED')) {
        if (data.settings.size) fontSizeInput.value = data.settings.size;
        if (data.settings.scale) scaleInput.value = data.settings.scale;
        applyViewerStyle();
      }
      setTimeout(scrollToBottom, 60);
    });

    // 接收 OT 操作更新內文並平滑滾動
    socket.on('remote_operation', data => {
      if (!data) return;

      if (data.is_clear) {
        displayArea.innerText = '';
        return;
      }

      let text = displayArea.innerText;
      const ops = data.ops || [];

      for (const op of ops) {
        if (op.type === 'insert') {
          const insertText = op.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
          const p = Math.min(op.pos, text.length);
          text = text.slice(0, p) + insertText + text.slice(p);
        } else if (op.type === 'delete') {
          const p = Math.min(op.pos, text.length);
          const endP = Math.min(p + op.len, text.length);
          text = text.slice(0, p) + text.slice(endP);
        }
      }

      displayArea.innerText = text;
      scrollToBottom();
    });

    // 若主控端在工作台調了整體預設比例，僅在觀眾未自己覆蓋時同步
    socket.on('sync_settings', settings => {
      if (settings && !sessionStorage.getItem('VIEWER_CUSTOMIZED')) {
        if (settings.size) fontSizeInput.value = settings.size;
        if (settings.scale) scaleInput.value = settings.scale;
        applyViewerStyle();
      }
    });

    // 標記觀眾手動調整過
    fontSizeInput.addEventListener('change', () => sessionStorage.setItem('VIEWER_CUSTOMIZED', '1'));
    scaleInput.addEventListener('change', () => sessionStorage.setItem('VIEWER_CUSTOMIZED', '1'));
  </script>
</body>
</html>
