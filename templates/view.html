<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時聽打投影 - 頻道 {{ room_id }}</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffff33;
      font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    /* 🌟 精簡版觀眾控制列：頂部浮現，4 秒自動淡化為低干擾 */
    .viewer-toolbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid #334155;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 2000;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
      color: #e2e8f0;
      font-size: 13px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .viewer-toolbar.dimmed {
      opacity: 0.15;
    }
    .viewer-toolbar:hover {
      opacity: 1 !important;
      transform: translateY(0);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .size-input {
      width: 54px;
      text-align: center;
      padding: 4px 6px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #1e293b;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .btn-step {
      padding: 4px 8px;
      border: 1px solid #475569;
      background: #334155;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }
    .btn-step:hover { background: #475569; }

    .btn {
      padding: 5px 12px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }
    .btn:hover { background: #334155; }
    
    .status-pill {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #94a3b8;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      box-shadow: 0 0 6px #22c55e;
    }

    #displayArea {
      width: 100%;
      min-height: 100%;
      font-size: 48px;
      line-height: 1.25;
      letter-spacing: 0px;
      white-space: pre-wrap;
      word-break: break-all;
      text-align: justify;
      transform-origin: top left;
      padding: 60px 16px 140px 16px;
    }

    body.is-fullscreen .viewer-toolbar {
      transform: translateY(-90%);
    }
    body.is-fullscreen .viewer-toolbar:hover {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- 🌟 觀眾端精簡控制列 -->
  <div class="viewer-toolbar" id="viewerToolbar">
    <!-- 1. 觀看比例 -->
    <div class="control-group">
      <label for="scaleInput">觀看比例：</label>
      <input type="number" id="scaleInput" class="size-input" value="100" min="40" max="250" step="5" onchange="onCustomScaleChange()">%
      <button class="btn-step" onclick="stepScale(5)">+5%</button>
      <button class="btn-step" onclick="stepScale(-5)">-5%</button>
    </div>

    <!-- 2. 自動捲動開關 -->
    <button class="btn" id="scrollToggleBtn" onclick="toggleAutoScroll()">
      ⬇️ 自動捲動：開
    </button>

    <!-- 3. 跟隨主投影開關 -->
    <button class="btn" id="followMasterBtn" onclick="toggleFollowMaster()">
      🔗 跟隨主投影：開
    </button>

    <button class="btn" onclick="toggleFullscreen()">
      ⛶ 全螢幕
    </button>

    <div class="status-pill">
      <span class="status-dot"></span>
      <span>頻道 {{ room_id }} 投影</span>
    </div>
  </div>

  <div id="displayArea"></div>

  <script>
    const socket = io({ reconnection: true, reconnectionAttempts: Infinity, reconnectionDelay: 500 });
    const roomId = "{{ room_id }}";
    const displayArea = document.getElementById('displayArea');
    const scaleInput = document.getElementById('scaleInput');
    const scrollToggleBtn = document.getElementById('scrollToggleBtn');
    const followMasterBtn = document.getElementById('followMasterBtn');
    const viewerToolbar = document.getElementById('viewerToolbar');

    let autoScrollEnabled = true;
    let followMasterEnabled = true; // 預設跟隨主控端縮放與排版
    let latestMasterSettings = null;
    let toolbarTimer = null;

    // 工具列閒置淡化
    function resetToolbarDim() {
      viewerToolbar.classList.remove('dimmed');
      clearTimeout(toolbarTimer);
      toolbarTimer = setTimeout(() => {
        viewerToolbar.classList.add('dimmed');
      }, 4000);
    }
    window.addEventListener('mousemove', resetToolbarDim);
    resetToolbarDim();

    // 🌟 1. 觀看比例調整
    function stepScale(delta) {
      let val = (parseInt(scaleInput.value, 10) || 100) + delta;
      scaleInput.value = Math.min(Math.max(val, 40), 250);
      onCustomScaleChange();
    }

    function onCustomScaleChange() {
      // 只要觀眾手動微調比例，自動將「跟隨主投影」切為關閉
      if (followMasterEnabled) {
        followMasterEnabled = false;
        updateFollowMasterUI();
      }
      applyScaleOnly();
    }

    function applyScaleOnly() {
      const scale = (parseInt(scaleInput.value, 10) || 100) / 100;
      if ('zoom' in displayArea.style) {
        displayArea.style.zoom = scale;
      } else {
        displayArea.style.transform = `scale(${scale})`;
        displayArea.style.width = `${100 / scale}%`;
      }
      scrollToBottom();
    }

    // 🌟 2. 自動捲動開關
    function toggleAutoScroll() {
      autoScrollEnabled = !autoScrollEnabled;
      updateAutoScrollUI();
      if (autoScrollEnabled) scrollToBottom();
    }

    function updateAutoScrollUI() {
      scrollToggleBtn.innerText = autoScrollEnabled ? "⬇️ 自動捲動：開" : "⏸️ 自動捲動：關";
      scrollToggleBtn.style.color = autoScrollEnabled ? "#4ade80" : "#f87171";
    }

    function scrollToBottom() {
      if (!autoScrollEnabled) return;
      window.scrollTo({
        top: document.documentElement.scrollHeight,
        behavior: 'smooth'
      });
    }

    // 若觀眾往上滾輪查閱歷史，自動暫停跳底；滾回底部自動恢復
    window.addEventListener('scroll', () => {
      const scrollPos = window.innerHeight + window.scrollY;
      const threshold = document.documentElement.scrollHeight - 80;
      if (scrollPos < threshold && autoScrollEnabled) {
        autoScrollEnabled = false;
        updateAutoScrollUI();
      } else if (scrollPos >= threshold && !autoScrollEnabled) {
        autoScrollEnabled = true;
        updateAutoScrollUI();
      }
    });

    // 🌟 3. 跟隨主投影開關
    function toggleFollowMaster() {
      followMasterEnabled = !followMasterEnabled;
      updateFollowMasterUI();

      // 若重新開啟跟隨，立刻套用主投影最新傳來的設定
      if (followMasterEnabled && latestMasterSettings) {
        applyMasterSettings(latestMasterSettings);
      }
    }

    function updateFollowMasterUI() {
      followMasterBtn.innerText = followMasterEnabled ? "🔗 跟隨主投影：開" : "🔒 獨立自訂：開";
      followMasterBtn.style.color = followMasterEnabled ? "#38bdf8" : "#fde047";
    }

    function applyMasterSettings(settings) {
      if (!settings) return;
      latestMasterSettings = settings;
      if (!followMasterEnabled) return; // 若觀眾選擇不跟隨，跳過

      if (settings.size) {
        displayArea.style.fontSize = settings.size + 'px';
      }
      if (settings.scale !== undefined) {
        scaleInput.value = settings.scale;
        const scaleVal = settings.scale / 100;
        if ('zoom' in displayArea.style) {
          displayArea.style.zoom = scaleVal;
        } else {
          displayArea.style.transform = `scale(${scaleVal})`;
          displayArea.style.width = `${100 / scaleVal}%`;
        }
      }
      const px = (settings.pad_x !== undefined ? settings.pad_x : 16) + 'px';
      const py = (settings.pad_y !== undefined ? settings.pad_y : 16) + 'px';
      displayArea.style.padding = `${py} ${px} 140px ${px}`;

      scrollToBottom();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
    document.addEventListener('fullscreenchange', () => {
      document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement);
    });

    // 連線進入（純唯讀身份）
    socket.on('connect', () => {
      socket.emit('join', { room: roomId, is_editor: false });
    });

    socket.on('init_document', data => {
      if (!data) return;
      displayArea.innerText = (data.text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      if (data.settings) {
        applyMasterSettings(data.settings);
      }
      setTimeout(scrollToBottom, 60);
    });

    // 接收 OT 增量排隊動作
    socket.on('remote_operation', data => {
      if (!data) return;

      if (data.is_clear) {
        displayArea.innerText = '';
        return;
      }

      let text = displayArea.innerText;
      const ops = data.ops || [];

      for (const op of ops) {
        if (op.type === 'insert') {
          const insertText = op.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
          const p = Math.min(op.pos, text.length);
          text = text.slice(0, p) + insertText + text.slice(p);
        } else if (op.type === 'delete') {
          const p = Math.min(op.pos, text.length);
          const endP = Math.min(p + op.len, text.length);
          text = text.slice(0, p) + text.slice(endP);
        }
      }

      displayArea.innerText = text;
      scrollToBottom();
    });

    // 主控端修改設定時同步廣播
    socket.on('sync_settings', settings => {
      applyMasterSettings(settings);
    });

    // 初始化狀態外觀
    updateAutoScrollUI();
    updateFollowMasterUI();
  </script>
</body>
</html>
