<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>觀眾大螢幕 - 頻道 {{ room_id }}</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0a0a0a; color: #ffff33;
      font-family: "TW-Kai", "DFKai-SB", "BiauKai", "標楷體", serif;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }
    #viewerContainer {
      flex: 1; padding: 16px 8px 60px 8px; font-size: 48px; line-height: 1.25;
      white-space: pre-wrap; word-break: break-all; overflow-y: auto; text-align: justify;
    }
    .remote-comp {
      color: inherit; border-bottom: 1px dashed rgba(255, 255, 255, 0.4); opacity: 0.85;
    }
  </style>
</head>
<body>
  <div id="viewerContainer">等待聽打員連線...</div>

  <script>
    const socket = io({ reconnection: true, reconnectionAttempts: Infinity });
    const roomId = "{{ room_id }}";
    const viewerContainer = document.getElementById('viewerContainer');
    
    let baseCommittedText = "";
    const remoteComposingMap = new Map();
    let isRenderScheduled = false;

    function scheduleUIRender() {
      if (!isRenderScheduled) {
        isRenderScheduled = true;
        requestAnimationFrame(() => {
          renderAudienceView();
          isRenderScheduled = false;
        });
      }
    }

    function renderAudienceView() {
      if (remoteComposingMap.size === 0) {
        viewerContainer.textContent = baseCommittedText;
        viewerContainer.scrollTop = viewerContainer.scrollHeight;
        return;
      }
      const comps = Array.from(remoteComposingMap.values()).sort((a, b) => a.pos - b.pos);
      viewerContainer.innerHTML = '';
      let lastIdx = 0;
      for (const c of comps) {
        const p = Math.min(Math.max(c.pos, 0), baseCommittedText.length);
        viewerContainer.appendChild(document.createTextNode(baseCommittedText.substring(lastIdx, p)));
        const span = document.createElement('span');
        span.className = 'remote-comp';
        span.textContent = c.text;
        viewerContainer.appendChild(span);
        lastIdx = p;
      }
      viewerContainer.appendChild(document.createTextNode(baseCommittedText.substring(lastIdx)));
      viewerContainer.scrollTop = viewerContainer.scrollHeight;
    }

    socket.on('connect', () => { viewerContainer.innerHTML = ''; socket.emit('join', { room: roomId, is_editor: false }); });

    socket.on('init_document', data => {
      baseCommittedText = (data.text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      scheduleUIRender();
      if (data && data.settings) applySettings(data.settings);
    });

    socket.on('sync_settings', data => { applySettings(data); });

    function applySettings(settings) {
      if (settings.theme === 'dark') { document.body.style.background = '#0a0a0a'; document.body.style.color = '#ffff33'; }
      if (settings.theme === 'green') { document.body.style.background = '#c7edcc'; document.body.style.color = '#111827'; }
      if (settings.theme === 'navy') { document.body.style.background = '#0b132b'; document.body.style.color = '#e0e1dd'; }
      if (settings.theme === 'light') { document.body.style.background = '#f1f5f9'; document.body.style.color = '#0f172a'; }
      const px = (settings.pad_x || 8) + 'px'; const py = (settings.pad_y || 16) + 'px';
      viewerContainer.style.fontSize = (settings.size || 48) + 'px';
      viewerContainer.style.padding = `${py} ${px} 60px ${px}`;
      viewerContainer.style.zoom = (settings.scale || 100) / 100;
    }

    socket.on('remote_operation', data => {
      if (data.is_clear) { baseCommittedText = ''; remoteComposingMap.clear(); scheduleUIRender(); return; }
      if (data.client_id) remoteComposingMap.delete(data.client_id);
      const ops = data.ops || [];
      for (let op of ops) {
        if (op.type === 'insert') {
          const p = Math.min(op.pos, baseCommittedText.length);
          baseCommittedText = baseCommittedText.slice(0, p) + op.text + baseCommittedText.slice(p);
        } else if (op.type === 'delete') {
          const p = Math.min(op.pos, baseCommittedText.length);
          const endP = Math.min(p + op.len, baseCommittedText.length);
          baseCommittedText = baseCommittedText.slice(0, p) + baseCommittedText.slice(endP);
        }
      }
      scheduleUIRender();
    });

    socket.on('remote_composing_stream', data => {
      if (!data || !data.client_id) return;
      if (data.composing_text && data.composing_text.length > 0) remoteComposingMap.set(data.client_id, { pos: data.cursor_index, text: data.composing_text });
      else remoteComposingMap.delete(data.client_id);
      scheduleUIRender();
    });
  </script>
</body>
</html>
