<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聽打即時投影看板 - 頻道 {{ room_id }}</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <!-- 🌟 引入開源繁體字型，確保手機端（iOS/Android）無內建標楷體時也能完美呈現楷體風格 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
    }

    #boardContainer {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    #contentBoard {
      width: 100%;
      min-height: 100%;
      /* 🌟 字型優先順序：電腦本機標楷體 -> 蘋果楷體 -> 手機雲端繁體襯線/楷體 */
      font-family: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", "KaiTi", "Noto Serif TC", serif;
      font-size: 48px;
      line-height: 1.15;
      letter-spacing: 0px;
      color: #ffff33;
      white-space: pre-wrap;
      word-break: break-all;
      text-align: justify;
      padding: 16px 12px 120px 12px;
      transform-origin: top left;
      transition: font-size 0.1s ease, padding 0.1s ease;
    }

    /* 懸浮工具條：供現場投影手動應急縮放/全螢幕 */
    .view-toolbar {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      opacity: 0.15;
      transition: opacity 0.25s;
      z-index: 1000;
    }
    .view-toolbar:hover {
      opacity: 1;
    }
    .btn-tool {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .btn-tool:hover {
      background: #2563eb;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>

  <div class="view-toolbar">
    <button class="btn-tool" onclick="adjustScale(5)">放大 (+5%)</button>
    <button class="btn-tool" onclick="adjustScale(-5)">縮小 (-5%)</button>
    <button class="btn-tool" onclick="toggleFullscreen()">⛶ 全螢幕</button>
  </div>

  <div id="boardContainer">
    <div id="contentBoard">載入連線中...</div>
  </div>

  <script>
    const socket = io({ reconnection: true, reconnectionAttempts: Infinity, reconnectionDelay: 500 });
    const roomId = "{{ room_id }}";
    const board = document.getElementById('contentBoard');
    const container = document.getElementById('boardContainer');

    let currentScale = 100;
    let autoScrollEnabled = true;

    // 檢測使用者是否手動向上滾動（暫停自動跟隨到底部）
    container.addEventListener('scroll', () => {
      const isAtBottom = (container.scrollHeight - container.scrollTop - container.clientHeight) < 80;
      autoScrollEnabled = isAtBottom;
    });

    socket.on('connect', () => {
      socket.emit('join', { room: roomId, is_editor: false });
    });

    socket.on('init_document', data => {
      if (!data) return;
      board.innerText = data.text || '';
      if (data.settings) applyStyleSettings(data.settings);
      scrollToBottom();
    });

    socket.on('sync_text', data => {
      if (!data) return;
      if (typeof data.text === 'string') {
        board.innerText = data.text;
      }
      if (data.is_master) {
        applyStyleSettings({
          size: data.size,
          scale: data.scale,
          pad_x: data.pad_x,
          pad_y: data.pad_y
        });
      }
      if (autoScrollEnabled) scrollToBottom();
    });

    function applyStyleSettings(settings) {
      if (!settings) return;
      if (settings.size) board.style.fontSize = settings.size + 'px';
      
      const px = (settings.pad_x !== undefined ? settings.pad_x : 8) + 'px';
      const py = (settings.pad_y !== undefined ? settings.pad_y : 10) + 'px';
      board.style.padding = `${py} ${px} 120px ${px}`;

      if (settings.scale !== undefined) {
        currentScale = settings.scale;
        const scaleVal = currentScale / 100;
        if ('zoom' in board.style) {
          board.style.zoom = scaleVal;
        } else {
          board.style.transform = `scale(${scaleVal})`;
          board.style.width = `${100 / scaleVal}%`;
        }
      }
    }

    function scrollToBottom() {
      container.scrollTop = container.scrollHeight;
    }

    function adjustScale(delta) {
      currentScale = Math.min(Math.max(currentScale + delta, 40), 250);
      const scaleVal = currentScale / 100;
      if ('zoom' in board.style) {
        board.style.zoom = scaleVal;
      } else {
        board.style.transform = `scale(${scaleVal})`;
        board.style.width = `${100 / scaleVal}%`;
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
