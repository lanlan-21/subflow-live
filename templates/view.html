<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時聽打投影 - 頻道 {{ room_id }}</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <!-- 🌟 Google 繁體正統楷書 WebFont CDN -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/earlyaccess/cwtexkai.css">
  <style>
    * { box-sizing: border-box; }
    
    body[data-theme="dark"] {
      --bg-main: #000000;
      --text-color: #ffff33;
      --ghost-color: rgba(255, 255, 51, 0.75);
      --ghost-underline: #ffff33;
    }
    body[data-theme="green"] {
      --bg-main: #c7edcc;
      --text-color: #111827;
      --ghost-color: rgba(17, 24, 39, 0.7);
      --ghost-underline: #047857;
    }
    body[data-theme="navy"] {
      --bg-main: #0b132b;
      --text-color: #e0e1dd;
      --ghost-color: rgba(224, 225, 221, 0.75);
      --ghost-underline: #38bdf8;
    }
    body[data-theme="light"] {
      --bg-main: #ffffff;
      --text-color: #0f172a;
      --ghost-color: rgba(15, 23, 42, 0.7);
      --ghost-underline: #2563eb;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-main, #000000);
      color: var(--text-color, #ffff33);
      font-family: "TW-Kai", "DFKai-SB", "BiauKai", "標楷體", "cwTeXKai", "Kaiti TC", "STKaiti", serif !important;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: smooth;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .viewer-toolbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid #334155;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 2000;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
      color: #e2e8f0;
      font-size: 13px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .viewer-toolbar.dimmed {
      opacity: 0.15;
    }
    .viewer-toolbar:hover {
      opacity: 1 !important;
      transform: translateY(0);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .size-input {
      width: 56px;
      text-align: center;
      padding: 4px 6px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #1e293b;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .btn-step {
      padding: 4px 8px;
      border: 1px solid #475569;
      background: #334155;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }
    .btn-step:hover { background: #475569; }

    .btn {
      padding: 5px 14px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn:hover { background: #334155; }
    
    .btn-following {
      background: #15803d;
      border-color: #22c55e;
      color: #f0fdf4;
      cursor: default;
    }
    .btn-free {
      background: #b45309;
      border-color: #f59e0b;
      color: #fffbeb;
      animation: pulseAttention 2s infinite alternate;
    }
    .btn-free:hover {
      background: #d97706;
    }
    @keyframes pulseAttention {
      from { box-shadow: 0 0 0 rgba(245, 158, 11, 0); }
      to { box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
    }

    .status-pill {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #94a3b8;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      box-shadow: 0 0 6px #22c55e;
    }

    #displayArea {
      width: 100%;
      min-height: 100%;
      font-family: "TW-Kai", "DFKai-SB", "BiauKai", "標楷體", "cwTeXKai", "Kaiti TC", "STKaiti", serif !important;
      font-size: 48px;
      line-height: 1.25;
      letter-spacing: 0px;
      color: var(--text-color, #ffff33);
      white-space: pre-wrap;
      word-break: break-all;
      text-align: justify;
      transform-origin: top left;
      padding: 60px 16px 140px 16px;
    }

    /* 🌟 即時敲字幽靈串流標籤（正在打的注音或字，帶有呼吸底線） */
    #liveGhostSpan {
      display: inline;
      color: var(--ghost-color);
      border-bottom: 3px dashed var(--ghost-underline);
      animation: ghostBlink 0.9s infinite alternate;
    }
    @keyframes ghostBlink {
      from { opacity: 0.6; }
      to { opacity: 1; }
    }

    body.is-fullscreen .viewer-toolbar {
      transform: translateY(-90%);
    }
    body.is-fullscreen .viewer-toolbar:hover {
      transform: translateY(0);
    }
  </style>
</head>
<body data-theme="dark">

  <div class="viewer-toolbar" id="viewerToolbar">
    <div class="control-group">
      <label for="scaleInput">觀看比例：</label>
      <input type="number" id="scaleInput" class="size-input" value="100" min="40" max="250" step="5" onchange="applyCurrentScale()">%
      <button class="btn-step" onclick="stepScale(5)">+5%</button>
      <button class="btn-step" onclick="stepScale(-5)">-5%</button>
    </div>

    <button class="btn btn-following" id="followBtn" onclick="onClickFollowButton()">
      🔗 跟隨主投影中（自動跳底）
    </button>

    <button class="btn" onclick="toggleFullscreen()">
      ⛶ 全螢幕
    </button>

    <div class="status-pill">
      <span class="status-dot"></span>
      <span>頻道 {{ room_id }} 投影</span>
    </div>
  </div>

  <div id="displayArea"><span id="solidText"></span><span id="liveGhostSpan" style="display: none;"></span></div>

  <script>
    const socket = io({ reconnection: true, reconnectionAttempts: Infinity, reconnectionDelay: 500 });
    const roomId = "{{ room_id }}";
    const displayArea = document.getElementById('displayArea');
    const solidText = document.getElementById('solidText');
    const liveGhostSpan = document.getElementById('liveGhostSpan');
    const scaleInput = document.getElementById('scaleInput');
    const followBtn = document.getElementById('followBtn');
    const viewerToolbar = document.getElementById('viewerToolbar');

    let isAutoScrolling = true;
    let hasUserCustomScale = false;
    let masterSettings = null;
    let toolbarTimer = null;

    function resetToolbarDim() {
      viewerToolbar.classList.remove('dimmed');
      clearTimeout(toolbarTimer);
      toolbarTimer = setTimeout(() => {
        viewerToolbar.classList.add('dimmed');
      }, 4000);
    }
    window.addEventListener('mousemove', resetToolbarDim);
    resetToolbarDim();

    function stepScale(delta) {
      let currentVal = parseInt(scaleInput.value, 10) || 100;
      scaleInput.value = Math.min(Math.max(currentVal + delta, 40), 250);
      applyCurrentScale();
    }

    function applyCurrentScale() {
      hasUserCustomScale = true;
      const scaleVal = (parseInt(scaleInput.value, 10) || 100) / 100;
      if ('zoom' in displayArea.style) {
        displayArea.style.zoom = scaleVal;
      } else {
        displayArea.style.transform = `scale(${scaleVal})`;
        displayArea.style.width = `${100 / scaleVal}%`;
      }
      if (isAutoScrolling) scrollToBottom();
    }

    function onClickFollowButton() {
      if (!isAutoScrolling) {
        setAutoScrollingMode(true);
        scrollToBottom();
      }
    }

    function setAutoScrollingMode(active) {
      isAutoScrolling = active;
      if (isAutoScrolling) {
        followBtn.className = "btn btn-following";
        followBtn.innerText = "🔗 跟隨主投影中（自動跳底）";
      } else {
        followBtn.className = "btn btn-free";
        followBtn.innerText = "📜 自由瀏覽中（點此切回跟隨）";
      }
    }

    function scrollToBottom() {
      if (!isAutoScrolling) return;
      window.scrollTo({
        top: document.documentElement.scrollHeight,
        behavior: 'smooth'
      });
    }

    window.addEventListener('scroll', () => {
      const scrollPos = window.innerHeight + window.scrollY;
      const threshold = document.documentElement.scrollHeight - 80;
      if (scrollPos < threshold && isAutoScrolling) {
        setAutoScrollingMode(false);
      } else if (scrollPos >= threshold && !isAutoScrolling) {
        setAutoScrollingMode(true);
      }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
    document.addEventListener('fullscreenchange', () => {
      document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement);
    });

    socket.on('connect', () => {
      socket.emit('join', { room: roomId, is_editor: false });
    });

    socket.on('init_document', data => {
      if (!data) return;
      solidText.innerText = (data.text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      liveGhostSpan.style.display = 'none';
      liveGhostSpan.innerText = '';
      if (data.settings) {
        masterSettings = data.settings;
        applyMasterSettings(masterSettings);
      }
      setTimeout(scrollToBottom, 60);
    });

    // 🌟 核心：接收即時注音/組字串流（未按 Enter 也能立刻在大螢幕末端跳動！）
    socket.on('audience_live_composing', data => {
      if (!data) return;
      const compText = data.composing_text || '';
      if (compText.trim().length > 0) {
        liveGhostSpan.innerText = compText;
        liveGhostSpan.style.display = 'inline';
      } else {
        liveGhostSpan.innerText = '';
        liveGhostSpan.style.display = 'none';
      }
      if (isAutoScrolling) scrollToBottom();
    });

    // 🌟 收到確認定稿動作：幽靈字清空，固化正式內文
    socket.on('remote_operation', data => {
      if (!data) return;

      liveGhostSpan.innerText = '';
      liveGhostSpan.style.display = 'none';

      if (data.is_clear) {
        solidText.innerText = '';
        return;
      }

      if (data.full_text !== undefined) {
        solidText.innerText = data.full_text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      } else {
        let text = solidText.innerText;
        const ops = data.ops || [];
        for (const op of ops) {
          if (op.type === 'insert') {
            const insertText = op.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const p = Math.min(op.pos, text.length);
            text = text.slice(0, p) + insertText + text.slice(p);
          } else if (op.type === 'delete') {
            const p = Math.min(op.pos, text.length);
            const endP = Math.min(p + op.len, text.length);
            text = text.slice(0, p) + text.slice(endP);
          }
        }
        solidText.innerText = text;
      }

      if (isAutoScrolling) scrollToBottom();
    });

    socket.on('sync_settings', settings => {
      masterSettings = settings;
      applyMasterSettings(settings);
    });

    function applyMasterSettings(settings) {
      if (!settings) return;

      if (settings.theme) {
        document.body.setAttribute('data-theme', settings.theme);
      }

      if (settings.size) {
        displayArea.style.fontSize = settings.size + 'px';
      }

      if (!hasUserCustomScale && settings.scale !== undefined) {
        scaleInput.value = settings.scale;
        const scaleVal = settings.scale / 100;
        if ('zoom' in displayArea.style) {
          displayArea.style.zoom = scaleVal;
        } else {
          displayArea.style.transform = `scale(${scaleVal})`;
          displayArea.style.width = `${100 / scaleVal}%`;
        }
      }

      const px = (settings.pad_x !== undefined ? settings.pad_x : 16) + 'px';
      const py = (settings.pad_y !== undefined ? settings.pad_y : 16) + 'px';
      displayArea.style.padding = `${py} ${px} 140px ${px}`;

      if (isAutoScrolling) scrollToBottom();
    }
  </script>
</body>
</html>
