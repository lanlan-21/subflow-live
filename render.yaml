# Free-tier TEST deployment. This deliberately does not provision paid storage.
# For an existing service, use the matching settings rather than creating a
# second service inadvertently. See RENDER.md for durable production storage.
services:
  - type: web
    name: subflow-live
    runtime: python
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 32 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SUBFLOW_DB
        value: /tmp/subflow/subflow.sqlite3
      - key: SUBFLOW_DURABLE_STORAGE
        value: "0"
